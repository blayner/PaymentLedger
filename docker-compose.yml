name: payment-ledger

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data in a versioned sub-directory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Traces and metrics UI (OTLP/gRPC receiver on 18889, dashboard on http://localhost:18888).
  # Logs stay in Serilog JSON on stdout (docker compose logs api); they are not exported over OTLP.
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      dashboard:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Persistence__Provider: Postgres
      ConnectionStrings__Ledger: "Host=postgres;Port=5432;Database=ledger;Username=ledger;Password=ledger"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://dashboard:18889"
      OTEL_SERVICE_NAME: payment-ledger
    ports:
      - "5080:8080"

volumes:
  postgres-data:
