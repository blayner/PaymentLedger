name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-unit-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PaymentLedger.sln

      - name: Build
        run: dotnet build PaymentLedger.sln --configuration Release --no-restore

      - name: Unit tests
        run: |
          for project in tests/PaymentLedger.Domain.Tests tests/PaymentLedger.Application.Tests; do
            name=$(basename "$project")
            dotnet test --project "$project" --configuration Release --no-build \
              --results-directory TestResults \
              --report-xunit-trx --report-xunit-trx-filename "$name.trx" \
              --coverage --coverage-output-format cobertura --coverage-output "$name.cobertura.xml"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults

  integration-test:
    name: Integration tests (PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Integration tests
        run: |
          dotnet test --project tests/PaymentLedger.Integration.Tests --configuration Release \
            --results-directory TestResults \
            --report-xunit-trx --report-xunit-trx-filename integration.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag payment-ledger:${{ github.sha }} .
